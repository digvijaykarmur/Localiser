[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localiser"
version = "1.0.0"
description = "Localiser — Hindi Manga Localization Studio (ChitraKatha pipeline)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
localiser = "localiser.cli.main:app"

[tool.setuptools.packages.find]
include = ["localiser*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
